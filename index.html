<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Digital Oscilloscope & Waveform Visualizer</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #121824;
      --accent-green: #00ff66;
      --accent-cyan: #00e5ff;
      --accent-amber: #ffb703;
      --grid-line: rgba(0, 229, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', monospace, sans-serif; }
    body { background-color: var(--bg-dark); color: #e2e8f0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

    header { margin-bottom: 20px; text-align: center; }
    h1 { color: var(--accent-cyan); font-size: 1.8rem; letter-spacing: 1px; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-top: 4px; }

    .dashboard { display: grid; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1100px; width: 100%; }

    /* Oscilloscope Screen Card */
    .scope-card { background: var(--card-bg); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 12px; padding: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); position: relative; }
    
    canvas#scopeCanvas { width: 100%; height: 380px; background: #04080f; border-radius: 8px; border: 2px solid #1e293b; display: block; }

    /* Control Panel */
    .control-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

    .metric-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 8px; }
    .metric-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-value { font-size: 1.4rem; font-weight: bold; color: var(--accent-green); margin-top: 4px; }
    .metric-value.cyan { color: var(--accent-cyan); }
    .metric-value.amber { color: var(--accent-amber); }

    .controls-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.85rem; color: #cbd5e1; }
    select, input[type="range"] { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; }
    
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: rgba(0, 255, 102, 0.1); color: var(--accent-green); border: 1px solid rgba(0, 255, 102, 0.3); }
    .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; animation: pulse 1.5s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    @media (max-width: 850px) {
      .dashboard { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎛️ ESP32 Digital Oscilloscope & Waveform Visualizer</h1>
    <p class="subtitle">Real-Time DSP Signal Processing • Sub-10ms Waveform Telemetry</p>
  </header>

  <div class="dashboard">
    <!-- Oscilloscope Canvas Area -->
    <div class="scope-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span class="status-badge"><span class="status-dot"></span> LIVE SIGNAL STREAM</span>
        <span style="font-size: 0.8rem; color: #64748b;">Grid: 0.5V / Div • 5ms / Div</span>
      </div>
      <canvas id="scopeCanvas" width="700" height="380"></canvas>
    </div>

    <!-- Right Control & Measurement Sidebar -->
    <div class="control-card">
      <h2 style="font-size: 1rem; color: var(--accent-cyan); margin-bottom: 5px;">Readout Metrics</h2>
      
      <div class="metric-box">
        <div class="metric-label">Signal Waveform</div>
        <div class="metric-value" id="valWave">SINE WAVE</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Signal Frequency (Hz)</div>
        <div class="metric-value cyan" id="valFreq">15.0 Hz</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Peak-to-Peak Voltage (Vpp)</div>
        <div class="metric-value amber" id="valVpp">2.80 V</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">RMS Voltage (Vrms)</div>
        <div class="metric-value" id="valVrms">1.98 V</div>
      </div>

      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1);">

      <div class="controls-group">
        <label for="selectWave">Simulate Signal Mode:</label>
        <select id="selectWave" onchange="updateSimulation()">
          <option value="SINE">Sine Wave 🌊</option>
          <option value="SQUARE">Square Wave ⏹️</option>
          <option value="SAWTOOTH">Sawtooth Wave 📐</option>
        </select>
      </div>

      <div class="controls-group">
        <label for="rangeFreq">Frequency Control (1Hz - 30Hz):</label>
        <input type="range" id="rangeFreq" min="1" max="30" value="15" oninput="updateSimulation()">
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');

    let currentWave = "SINE";
    let currentFreq = 15.0;
    let currentVpp = 2.80;
    let timeOffset = 0;

    function drawGrid() {
      ctx.strokeStyle = '#0d1d2d';
      ctx.lineWidth = 1;
      
      const stepX = canvas.width / 10;
      const stepY = canvas.height / 8;

      for (let x = 0; x <= canvas.width; x += stepX) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = 0; y <= canvas.height; y += stepY) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      ctx.strokeStyle = '#1e3a5f';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
    }

    function renderScope() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      ctx.strokeStyle = '#00ff66';
      ctx.shadowColor = '#00ff66';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      const midY = canvas.height / 2;
      const amplitudePx = (currentVpp / 3.3) * (canvas.height / 2 - 20);
      const points = 200;

      for (let i = 0; i < points; i++) {
        const x = (i / points) * canvas.width;
        const normTime = ((i / points) * (currentFreq / 5.0) + timeOffset) % 1.0;
        let yVal = 0;

        if (currentWave === "SINE") {
          yVal = Math.sin(normTime * 2 * Math.PI);
        } else if (currentWave === "SQUARE") {
          yVal = normTime < 0.5 ? 1 : -1;
        } else if (currentWave === "SAWTOOTH") {
          yVal = (normTime * 2) - 1;
        }

        const y = midY - (yVal * amplitudePx);

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.stroke();
      ctx.shadowBlur = 0;

      timeOffset += 0.02;
      requestAnimationFrame(renderScope);
    }

    function updateSimulation() {
      currentWave = document.getElementById('selectWave').value;
      currentFreq = parseFloat(document.getElementById('rangeFreq').value);
      currentVpp = 2.80;

      document.getElementById('valWave').innerText = currentWave + " WAVE";
      document.getElementById('valFreq').innerText = currentFreq.toFixed(1) + " Hz";
      document.getElementById('valVpp').innerText = currentVpp.toFixed(2) + " V";
      document.getElementById('valVrms').innerText = (currentVpp * 0.707).toFixed(2) + " V";
    }

    updateSimulation();
    renderScope();
  </script>
</body>
</html>
